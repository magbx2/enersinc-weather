[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-dashboard-backend"
version = "1.0.0"
description = "Two-city weather comparison API and live update channel"
requires-python = ">=3.12"
dependencies = [
  "Django==5.1.4",
  "djangorestframework==3.15.2",
  "channels==4.2.0",
  "channels-redis==4.2.1",
  # redis 8 defaults socket_timeout to 5s, which collides with the 5s BZPOPMIN
  # that channels-redis uses to receive messages: every WebSocket dies after
  # ~5s with "Timeout reading from redis". Keep the 5.x line channels-redis
  # 4.2.1 is built against.
  "redis==5.2.1",
  "daphne==4.1.2",
  "django-redis==5.4.0",
  "psycopg[binary]==3.2.3",
  "celery==5.4.0",
  "whitenoise==6.8.2",
  "httpx==0.27.2",
  "litellm==1.55.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-django==4.9.0",
  "respx==0.21.1",
  "freezegun==1.5.1",
  "ruff==0.7.4",
  "mypy==1.13.0",
  "django-stubs==5.1.1",
  "djangorestframework-stubs==3.15.2",
]

[tool.setuptools.packages.find]
include = ["config*", "weather*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["weather/tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "DJ"]
# DJ001: country_code is intentionally nullable (contract).
# N818: provider exceptions mirror the documented error codes.
ignore = ["B008", "DJ001", "N818"]

[tool.ruff.lint.per-file-ignores]
"weather/migrations/*" = ["E501"]
"*/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["weather/migrations/", "weather/tests/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings"
