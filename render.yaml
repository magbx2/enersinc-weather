# Render Blueprint: creates the full weather-dashboard stack in one deploy.
# Usage: Render dashboard -> New -> Blueprint -> select this repository.
#
# Notes:
# - Render blueprints only provision Postgres in the `databases` section.
#   Create the Redis instance separately (Render Key Value in the dashboard,
#   or a free provider like Upstash) and set REDIS_URL below in each service.
# - worker and beat are Background Workers (paid Starter plan on Render).
# - The free Postgres plan expires after 30 days; upgrade or bring your own.

databases:
  - name: weather-db
    databaseName: weather
    user: weather
    plan: free

services:
  # HTTP + WebSockets + SPA serving (same image as local docker-compose).
  - type: web
    name: weather-backend
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health/
    # Render injects PORT and expects the process to bind to it.
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars: &backend_env
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Leading dot matches every subdomain Render assigns (*.onrender.com).
      # Replace with your custom domain when you have one.
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      # Redis is not provisionable via blueprint: create a Render Key Value
      # (dashboard) or a free Upstash instance and paste its URL here.
      - key: REDIS_URL
        sync: false
      - key: OPENWEATHER_BASE_URL
        value: https://api.openweathermap.org
      # Set these in the Render dashboard after the first deploy
      # (sync: false marks them as "required, filled manually").
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        sync: false
      - key: THROTTLE_REFRESH
        value: 30/min
      - key: THROTTLE_EXPORT
        value: 20/min
      - key: THROTTLE_CHAT
        value: 12/min

  # Celery worker: fetches weather readings on demand.
  - type: worker
    name: weather-worker
    dockerfilePath: ./Dockerfile.render
    startCommand: celery -A config worker --loglevel=info
    envVars: *backend_env

  # Celery beat: schedules refresh_tracked_cities every minute.
  - type: worker
    name: weather-beat
    dockerfilePath: ./Dockerfile.render
    startCommand: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    envVars: *backend_env
